[package]
name = "mass-print"
version = "0.1.2"
description = "A lightweight macOS batch printing utility"
authors = ["Mass Print contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "mass_print_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mass-print-core = { path = "../crates/mass-print-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["serde"] }

