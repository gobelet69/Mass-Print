name: macOS Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt

      - name: Verify release version and tag
        run: ./scripts/check-release-version.sh

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Import Developer ID certificate and notarization credentials (if provided)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_CERTIFICATE_P12:-}" ] && [ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Importing Developer ID certificate..."
            KEYCHAIN_PATH="$RUNNER_TEMP/mass-print-signing.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
            CERTIFICATE_PATH="$RUNNER_TEMP/mass-print-developer-id.p12"
            printf "%s" "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" \
              -P "$MACOS_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list \
              -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            if [ -n "${APPLE_NOTARY_ID:-}" ]; then
              xcrun notarytool store-credentials mass-print-ci \
                --apple-id "$APPLE_NOTARY_ID" \
                --password "$APPLE_NOTARY_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --keychain "$KEYCHAIN_PATH"
              echo "MASS_PRINT_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
              echo "HAS_NOTARIZATION=true" >> "$GITHUB_ENV"
            fi
            echo "MASS_PRINT_CODESIGN_IDENTITY=${{ secrets.MACOS_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          else
            echo "No Developer ID configured. Using ad-hoc build."
            echo "MASS_PRINT_CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "HAS_NOTARIZATION=false" >> "$GITHUB_ENV"
          fi

      - name: Build universal native macOS application
        run: ./scripts/build-native-app.sh

      - name: Notarize, staple, package, and verify Gatekeeper acceptance
        if: env.HAS_NOTARIZATION == 'true'
        env:
          MASS_PRINT_NOTARY_PROFILE: mass-print-ci
          MASS_PRINT_NOTARY_KEYCHAIN: ${{ env.MASS_PRINT_NOTARY_KEYCHAIN }}
        run: ./scripts/notarize-native-release.sh

      - name: Package native release artifacts (ad-hoc fallback)
        if: env.HAS_NOTARIZATION != 'true'
        run: ./scripts/package-native-release.sh

      - uses: softprops/action-gh-release@v2
        with:
          name: "Mass Print ${{ github.ref_name }}"
          body: |
            Fully native SwiftUI/AppKit macOS application with its tested Rust printing engine.

            Universal build for Apple Silicon and Intel. No WebView or Tauri runtime.

            Check SHA256SUMS.txt for artifact integrity verification.
          files: dist-native/*
          fail_on_unmatched_files: true
