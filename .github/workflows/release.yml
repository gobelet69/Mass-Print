name: macOS Native Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --workspace
      - run: ./scripts/build-native-app.sh
      - run: ./scripts/package-native-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          name: "Mass Print ${{ github.ref_name }}"
          body: |
            Fully native SwiftUI/AppKit macOS application with its tested Rust printing engine.

            Universal build for Apple Silicon and Intel. No WebView or Tauri runtime.

            This build is ad-hoc signed and not notarized.
          files: dist-native/*
          fail_on_unmatched_files: true
