[workspace]
members = ["crates/mass-print-core", "crates/mass-print-ffi"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
lopdf = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

