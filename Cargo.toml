[workspace]
members = ["crates/mass-print-core"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
lopdf = "0.38"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

